spring.application.name=proyectoCoWorkHub
# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub
spring.datasource.username=root
spring.datasource.password=@lixteamo10102019

# Configuración de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
# Mostrar consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

coworkhub.booking.max-advance-days=30
coworkhub.time-zone=America/Bogota

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=3600000

security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:twdforever2026}
logging.level.org.springframework.security=TRACE

# ==========================================
# SPRINGDOC - SWAGGER / OPENAPI
# ==========================================

# Ruta personalizada de Swagger UI
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Ruta de documentación OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Habilitar documentación
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Expandir los grupos de endpoints
springdoc.swagger-ui.doc-expansion=none

# Ordenar operaciones por método HTTP
springdoc.swagger-ui.operations-sorter=method

# Ordenar etiquetas alfabéticamente
springdoc.swagger-ui.tags-sorter=alpha