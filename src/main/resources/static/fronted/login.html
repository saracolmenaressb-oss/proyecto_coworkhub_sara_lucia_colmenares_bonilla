<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - CoWorkHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
        <span class="brand-badge">CoWorkHub</span>
        <h1 id="loginTitle">Iniciar sesión</h1>
        <p class="subtitle">Ingresa tus credenciales para acceder al sistema de reservas.</p>

        <div id="loginAlert" class="alert is-hidden" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ej. admin"
                        autocomplete="username"
                        required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                >
            </div>

            <button type="submit" id="submitBtn" class="btn-primary">
                Entrar
            </button>
        </form>
    </section>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
