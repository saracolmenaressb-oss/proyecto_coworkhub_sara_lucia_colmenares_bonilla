<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoworkHub - Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
        <span class="brand-badge">CoworkHub</span>
        <h1 id="login-title">Iniciar sesión</h1>
        <p class="subtitle">Accede para gestionar espacios y reservas.</p>

        <div id="login-alert" class="alert alert-error is-hidden" role="alert"></div>

        <form id="login-form" novalidate>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="admin"
                        autocomplete="username"
                        required
                />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                />
            </div>

            <button id="login-submit" type="submit" class="btn-primary">
                Ingresar
            </button>
        </form>
    </section>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
